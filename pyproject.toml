[project]
name = "go-mb-simulation"
version = "0.1.0"
description = "Experimento computacional 2D de adsorción MB–GO (motor científico independiente de la vista)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
